name: Copia script
on:
  push:
    #Indicamos la rama en la que hacer el push
    #branches: [ main ]

jobs:
  ejecutar_script:
    runs-on: ubuntu-24.04
    steps:
    - name: descargar repositorio
      uses: actions/checkout@v5
      
    - name: crear carpeta backup
      run: 
        mkdir -p backup
    - name: crear zip comprimido
      run: 
        zip -r backup/backup_datos.zip datos
    
    - name: subir artefacto
      uses: actions/checkout@v5